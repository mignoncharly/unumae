name: Hosted health and capacity

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Keep warm and check service/disk health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          MAXIMUM_DISK_RATIO: ${{ vars.MAXIMUM_DISK_RATIO }}
        run: node scripts/check-hosted-project.mjs
      - name: Open or update environment alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: Hosted ${{ matrix.target }} health check failed
        run: |
          existing="$(gh issue list --state open --search "$ALERT_TITLE in:title" --json number --jq '.[0].number // empty')"
          body="Investigate project health, quota, or pause state: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if test -n "$existing"; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$ALERT_TITLE" --body "$body"; fi
