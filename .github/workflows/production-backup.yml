name: Encrypted production backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Database and storage backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-backup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned operating-system clients
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - name: Export database and private storage
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file backup/database.dump
          node scripts/export-storage-backup.mjs backup/storage
          tar -C backup -czf backup/storage.tar.gz storage
      - name: Encrypt and checksum before upload
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          age --recipient "$BACKUP_AGE_RECIPIENT" --output backup/database.dump.age backup/database.dump
          age --recipient "$BACKUP_AGE_RECIPIENT" --output backup/storage.tar.gz.age backup/storage.tar.gz
          sha256sum backup/*.age > backup/SHA256SUMS
          rm backup/database.dump backup/storage.tar.gz
          rm -rf backup/storage
      - name: Allocate backup generation
        id: generation
        run: |
          echo "value=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted generation to GitHub artifact storage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unumae-backup-${{ steps.generation.outputs.value }}
          path: backup
          if-no-files-found: error
          retention-days: 35
          compression-level: 0
      - name: Record backup generation
        run: |
          printf '### Production backup\n\n- Generation: `%s`\n- Artifact: `unumae-backup-%s`\n- Commit: `%s`\n- Retention: **35 days**\n' \
            "${{ steps.generation.outputs.value }}" \
            "${{ steps.generation.outputs.value }}" \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update backup-failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --search 'Production backup failed in:title' --json number --jq '.[0].number // empty')"
          if test -n "$existing"; then
            gh issue comment "$existing" --body "Backup failed again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create --title 'Production backup failed' --body "Investigate immediately: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
