name: Release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA that already passed CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify_and_smoke:
    name: Verify CI provenance and run Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Require successful CI for this exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node scripts/verify-ci-provenance.mjs
      - name: Run EAS Maestro workflow from the tested checkout
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@22.4.0 workflow:run .eas/workflows/e2e-ios.yml --non-interactive
