name: Restore rehearsal

on:
  workflow_dispatch:
    inputs:
      backup_generation:
        description: UTC generation timestamp from the backup workflow
        required: true
        type: string
      backup_run_id:
        description: Backup workflow run ID containing the generation artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  restore:
    name: Timed restore into isolated hosted PostgreSQL target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-backup
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install restore clients
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - name: Download encrypted generation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unumae-backup-${{ inputs.backup_generation }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backup_run_id }}
          path: restore
      - name: Decrypt and verify one complete generation
        env:
          AGE_SECRET_KEY: ${{ secrets.BACKUP_AGE_SECRET_KEY }}
          GENERATION: ${{ inputs.backup_generation }}
        run: |
          case "$GENERATION" in
            ????-??-??T??-??-??Z) ;;
            *) echo "backup_generation must be a UTC timestamp such as 2026-08-28T02-17-00Z" >&2; exit 1 ;;
          esac
          cd restore
          sha256sum --check SHA256SUMS
          printf '%s\n' "$AGE_SECRET_KEY" > age-key.txt
          age --decrypt --identity age-key.txt --output database.dump database.dump.age
          age --decrypt --identity age-key.txt --output storage.tar.gz storage.tar.gz.age
          mkdir extracted-storage
          tar -xzf storage.tar.gz -C extracted-storage
          node ../scripts/verify-storage-backup.mjs extracted-storage/storage
      - name: Restore into isolated hosted target and record elapsed time
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: |
          test -n "$RESTORE_DATABASE_URL"
          started="$(date +%s)"
          pg_restore --dbname "$RESTORE_DATABASE_URL" --clean --if-exists --no-owner --no-privileges --exit-on-error restore/database.dump
          psql "$RESTORE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/verify-restored-database.sql
          elapsed="$(( $(date +%s) - started ))"
          printf '### Restore rehearsal\n\n- Generation: `%s`\n- Backup run: `%s`\n- Commit: `%s`\n- Target: **isolated hosted PostgreSQL**\n- Elapsed: **%s seconds**\n' "${{ inputs.backup_generation }}" "${{ inputs.backup_run_id }}" "$GITHUB_SHA" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove downloaded restore materials
        if: always()
        run: rm -rf restore
