project_id = "onehuman"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "onehuman://"
additional_redirect_urls = ["onehuman://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Article 6.1 — guest viewing is a permanent right, so anonymous read access is
# provided by RLS policies on public data, not by anonymous sign-ins.
enable_anonymous_sign_ins = false
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Sign in with Apple is configured in the hosted dashboard, for com.unumae.app.
# This block governs the LOCAL stack only and stays disabled on purpose:
# enabling it here requires client_id and secret in this file, and no new
# credentials go into the repository.
[auth.external.apple]
enabled = false

[analytics]
enabled = false
