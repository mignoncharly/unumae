project_id = "onehuman"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

# The CLI recreates configured buckets after `db reset`, so keep these limits
# in local infrastructure config as well as the hosted migration. Otherwise a
# fresh stack replaces the migrated values with unrestricted bucket defaults.
[storage.buckets.avatars]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.portraits]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg"]

[auth]
enabled = true
site_url = "onehuman://"
additional_redirect_urls = ["onehuman://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Article 6.1 — guest viewing is a permanent right, so anonymous read access is
# provided by RLS policies on public data, not by anonymous sign-ins.
enable_anonymous_sign_ins = false
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Six digits, not a link. The app calls verifyOtp with type 'email'.
otp_length = 6
otp_expiry = 3600

# The templates are files so they are reviewable and version controlled.
#
# They must contain {{ .Token }} and not {{ .ConfirmationURL }}. A link cannot
# complete a code flow: it hands the session to a browser, and the browser then
# has to get it back to the app. With the stock templates the first real sign-in
# landed on http://localhost:3000 with the session in the URL fragment, and the
# app never saw it.
#
# Supabase chooses between the two by whether the address is already known —
# "magic link" for an existing user, "confirmation" for a new one — so both
# carry a code, or sign-in works only for people who have been here before.
#
# This file governs the LOCAL stack. The hosted project's templates are set in
# its dashboard; docs/OPERATIONS.md records that, and why `supabase config push`
# is not used to do it.
[auth.email.template.magic_link]
subject = "Your Unumae code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Your Unumae code"
content_path = "./supabase/templates/confirmation.html"

# Sign in with Apple is configured in the hosted dashboard, for com.unumae.app.
# This block governs the LOCAL stack only and stays disabled on purpose:
# enabling it here requires client_id and secret in this file, and no new
# credentials go into the repository.
[auth.external.apple]
enabled = false

[analytics]
enabled = false
