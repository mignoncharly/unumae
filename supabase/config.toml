project_id = "onehuman"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "onehuman-dev://"
additional_redirect_urls = ["onehuman-dev://", "onehuman-staging://", "onehuman://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Article 6.1 — guest viewing is a permanent right, so anonymous read access is
# provided by RLS policies on public data, not by anonymous sign-ins.
enable_anonymous_sign_ins = false
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Phase 3 enables Apple. Kept explicit so the file documents what is off.
[auth.external.apple]
enabled = false

[analytics]
enabled = false
