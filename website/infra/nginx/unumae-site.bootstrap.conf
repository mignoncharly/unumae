# Temporary HTTP-only host used solely while the dedicated certificate is
# issued. It serves Unumae's own release and ACME root; no upstream, web root,
# log, or certificate from another application is referenced.
server {
    listen 80;
    listen [::]:80;
    server_name unumae.app www.unumae.app;

    root /srv/unumae-site/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/unumae-site.access.log;
    error_log /var/log/nginx/unumae-site.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/unumae-site/acme;
        default_type "text/plain";
    }

    location / {
        try_files $uri/index.html $uri.html $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
