# Unumae marketing/public site. This vhost is intentionally static and
# isolated: dedicated root, certificate tree, logs, health timer and hostnames.

server {
    listen 80;
    listen [::]:80;
    server_name unumae.app www.unumae.app;
    server_tokens off;

    access_log /var/log/nginx/unumae-site.access.log;
    error_log /var/log/nginx/unumae-site.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/unumae-site/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://unumae.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.unumae.app;

    root /srv/unumae-site/current;
    server_tokens off;

    access_log /var/log/nginx/unumae-site.access.log;
    error_log /var/log/nginx/unumae-site.error.log warn;

    ssl_certificate /srv/unumae-site/certbot/config/live/unumae-site/fullchain.pem;
    ssl_certificate_key /srv/unumae-site/certbot/config/live/unumae-site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:unumae_site_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/unumae-site-security.conf;

    location = /.well-known/apple-app-site-association {
        default_type "application/json";
        try_files $uri =404;
    }

    location / {
        return 301 https://unumae.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unumae.app;

    root /srv/unumae-site/current;
    index index.html;
    server_tokens off;

    ssl_certificate /srv/unumae-site/certbot/config/live/unumae-site/fullchain.pem;
    ssl_certificate_key /srv/unumae-site/certbot/config/live/unumae-site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:unumae_site_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/unumae-site.access.log;
    error_log /var/log/nginx/unumae-site.error.log warn;

    etag on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    include /etc/nginx/snippets/unumae-site-security.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location = /healthz {
        access_log off;
        default_type "text/plain; charset=utf-8";
        try_files /healthz =503;
    }

    location = /.well-known/apple-app-site-association {
        default_type "application/json";
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /srv/unumae-site/acme;
        default_type "text/plain";
    }

    location ^~ /_astro/ {
        include /etc/nginx/snippets/unumae-site-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/(?:brand|fonts|icons|social)/ {
        include /etc/nginx/snippets/unumae-site-security.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri/index.html $uri.html $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
